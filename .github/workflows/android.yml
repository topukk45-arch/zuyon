name: 构建安卓 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布「最新测试版」要用
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      # 出包前先把该跑的跑一遍,不合格就不出包
      - name: 纯函数测试
        run: npm test

      - name: 架构检查
        run: npm run check

      - name: 外壳链路冒烟（jsdom）
        run: npm run test:shell

      - name: 生成 www 并同步到原生工程
        run: npm run android

      - name: 还原并校验签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          KS="$RUNNER_TEMP/zuyong.keystore"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 是空的。四个签名 Secret 都要配，见 README。"
            exit 1
          fi

          # 容错：去掉换行，也去掉 certutil -encode 会加的 BEGIN/END 头尾
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | sed 's/-----[A-Z ]*-----//g' \
            | base64 -d > "$KS" 2>/dev/null || {
              echo "::error::KEYSTORE_BASE64 不是合法的 base64。PowerShell 用："
              echo "  [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"路径\\你的.keystore\")) | Set-Clipboard"
              echo "  不要用 certutil -encode，它会加头尾标记。"
              exit 1
            }

          echo "keystore 大小：$(stat -c%s "$KS") 字节"

          # 编译前就验一次，别等 gradle 从 ASN.1 报错里暴露问题
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1; then
            echo "::error::keystore 读不出来。要么 base64 转坏了，要么 KEYSTORE_PASSWORD 不对。"
            sed 's/^/  /' /tmp/ks.txt
            exit 1
          fi

          if ! grep -q "^$KEY_ALIAS," /tmp/ks.txt; then
            echo "::error::keystore 里没有别名 $KEY_ALIAS。里面实际有："
            grep ',.*PrivateKeyEntry' /tmp/ks.txt | cut -d, -f1 | sed 's/^/  /'
            exit 1
          fi

          echo "✓ keystore 可用，别名 $KEY_ALIAS 存在"

      - name: 编译 APK（固定签名，可覆盖升级）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/zuyong.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 「不联网」不能只是一句注释。在最终合并产物上验一次。
      - name: 核对合并后的 manifest 没有 INTERNET 权限
        run: |
          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "合并后的 manifest：$MERGED"
          cat "$MERGED"
          if grep -q 'android.permission.INTERNET' "$MERGED"; then
            echo "::error::合并后的 manifest 里出现了 INTERNET 权限，不联网的承诺破了"
            exit 1
          fi
          echo "✓ 没有 INTERNET 权限"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: zuyong-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 每次 main 打包成功,就把 apk 放进固定的「最新测试版」发行页。
      # 下载地址永远不变、不用登录、下到的直接是 apk(Actions 里的是要登录的 zip,而且 90 天过期)。
      # 标成预发行,不会顶掉手动发的正式版。
      - name: 发布到「最新测试版」
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(grep -oE "VERSION = '[^']+'" src/core/version.js | cut -d"'" -f2)
          APK="$RUNNER_TEMP/zuyong-latest.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          WHEN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          NOTES="版本 $VER，打包于 $WHEN（北京时间），对应提交 ${GITHUB_SHA::7}：$(git log -1 --format=%s)

          直接下载下面的 zuyong-latest.apk 安装即可，签名不变，可以覆盖升级。
          这里永远是最新一次打包的结果；历史版本见仓库里的 CHANGELOG.md。"
          # 标签跟着本次提交走
          git push -f origin "$GITHUB_SHA:refs/tags/latest-build"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "最新测试版 $VER" --notes "$NOTES" --prerelease
            gh release upload latest-build "$APK" --clobber
          else
            gh release create latest-build "$APK" --title "最新测试版 $VER" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
